@if (productData(); as product) {
  <mat-card class="product-details-card">
    <mat-card-header>
      <div class="product-image">
        <img [src]="product.imageUrl" [alt]="product.name" />
      </div>

      <mat-card-title-group>
        <mat-card-title>{{ product.name }}</mat-card-title>
        <mat-card-subtitle>Price: {{ product.price }} RON</mat-card-subtitle>
      </mat-card-title-group>
    </mat-card-header>

    <mat-card-content>
      <div class="item-category">
        <h3>Category: {{ product.category }}</h3>
        <p>{{ product.categoryDescription }}</p>
      </div>

      <div class="item-description">
        <p>{{ product.description }}</p>
      </div>

      <div class="item-weight">
        <p>Weight: {{ product.weight }} kg</p>
      </div>
    </mat-card-content>

    <mat-card-actions class="product-actions">
      @if (isAdmin()) {
        <button mat-stroked-button color="primary" (click)="updateProductClicked.emit(product.id)">
          Edit
        </button>
        <button mat-stroked-button class="btn-delete-mat" (click)="showDeleteConfirmation()">
          Delete
        </button>
      }
      <button mat-flat-button color="primary" (click)="addToCartClicked.emit(product)">
        Add to Cart
      </button>
    </mat-card-actions>
  </mat-card>
}
