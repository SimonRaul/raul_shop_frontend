@if (productData(); as product) {
  <mat-card class="product-details-card">
    <mat-card-header>
      <div class="product-image">
        <img [src]="product.imageUrl" [alt]="product.name" />
      </div>

      <mat-card-title-group>
        <mat-card-title>{{ product.name }}</mat-card-title>
        <mat-card-subtitle i18n>Price: {{ product.price }} RON</mat-card-subtitle>
      </mat-card-title-group>
    </mat-card-header>

    <mat-card-content>
      <div class="item-category">
        <h3 i18n>Category: {{ product.category }}</h3>
        <p>{{ product.categoryDescription }}</p>
      </div>

      <div class="item-description">
        <p>{{ product.description }}</p>
      </div>

      <div class="item-weight">
        <p i18n>Weight: {{ product.weight }} kg</p>
      </div>
    </mat-card-content>

    <mat-card-actions class="product-actions">
      @if (isAdmin()) {
        <button
          mat-stroked-button
          color="primary"
          (click)="updateProductClicked.emit(product.id)"
          i18n
        >
          Edit
        </button>
        <button
          mat-stroked-button
          class="btn-delete-mat"
          (click)="deleteProductClicked.emit(product.id)"
          i18n
        >
          Delete
        </button>
      }
      <button mat-flat-button color="primary" (click)="addToCartClicked.emit(product)" i18n>
        Add to Cart
      </button>
    </mat-card-actions>
  </mat-card>
}
