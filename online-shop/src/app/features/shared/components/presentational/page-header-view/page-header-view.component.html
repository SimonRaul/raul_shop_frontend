<nav class="navbar">
  <div class="navbar-brand">
    <a routerLink="/" class="logo">MyStore</a>
  </div>

  <div class="navbar-menu">
    @if (isLoggedIn()) {
      <ul class="nav-links">
        <li><a routerLink="/products" routerLinkActive="active">Products</a></li>
        <li><a routerLink="/shopping-cart" routerLinkActive="active">Shopping Cart</a></li>
      </ul>
    }

    <div class="auth-actions">
      @if (isLoggedIn()) {
        <button class="btn-profile" routerLink="/profile">
          <span class="avatar">
            {{ currentUser()?.firstName?.charAt(0) | uppercase }}
          </span>
          <span class="username">{{ currentUser()?.firstName }}</span>
        </button>

        <button class="btn-logout" (click)="logoutClicked.emit()">Logout</button>
      } @else {
        <button class="btn-login" routerLink="/login">Login</button>
      }
    </div>
  </div>
</nav>
