<mat-toolbar>
  <a routerLink="/" class="logo">MyStore</a>

  @if (isLoggedIn()) {
    <div class="nav-links">
      <a mat-button routerLink="/products" routerLinkActive="active-link">Products</a>
      <a mat-button routerLink="/shopping-cart" routerLinkActive="active-link">Shopping Cart</a>
    </div>
  }

  <span class="spacer"></span>

  <div class="auth-actions">
    @if (isLoggedIn()) {
      <button mat-button routerLink="/profile" class="profile-btn">
        <span class="avatar">
          {{ currentUser()?.firstName?.charAt(0) | uppercase }}
        </span>
        <span class="username">{{ currentUser()?.firstName }}</span>
      </button>

      <button mat-button (click)="logoutClicked.emit()">Logout</button>
    } @else {
      <button mat-flat-button color="primary" routerLink="/login">Login</button>
    }
  </div>
</mat-toolbar>
