<div class="shopping-cart">
  @if (items().length > 0) {
    <div class="page-title">
      <h1>Your Cart</h1>
    </div>

    <div class="cart-container">
      <div class="cart-items-list">
        @for (item of items(); track item.product.id) {
          <mat-card class="cart-item-card">
            <mat-card-content class="cart-item-content">
              <div class="item-image">
                <img [src]="item.product.imageUrl" [alt]="item.product.name" />
              </div>

              <div class="item-details">
                <span class="item-name">{{ item.product.name }}</span>
                <span class="item-price">Price: {{ item.product.price }} RON</span>
              </div>

              <div class="item-actions">
                <div class="quantity-control">
                  <label for="qty-{{ item.product.id }}">Quantity:</label>
                  <input
                    id="qty-{{ item.product.id }}"
                    #qtyInput
                    type="number"
                    class="qty-input"
                    [value]="item.quantity"
                    min="1"
                    (change)="
                      quantityChanged.emit({ productId: item.product.id, rawValue: qtyInput.value })
                    "
                  />
                </div>
                <button mat-stroked-button color="warn" (click)="itemRemoved.emit(item.product.id)">
                  Delete
                </button>
              </div>
            </mat-card-content>
          </mat-card>
        }
      </div>

      <div class="summary-wrapper">
        <mat-card class="order-summary-card">
          <mat-card-header>
            <mat-card-title>Order Summary</mat-card-title>
          </mat-card-header>

          <mat-card-content>
            <div class="summary-row">
              <span>Total Items:</span>
              <span>{{ totalItems() }}</span>
            </div>
            <div class="summary-row total">
              <span>Total Price:</span>
              <span>{{ totalPrice() }} RON</span>
            </div>
          </mat-card-content>

          <mat-card-actions>
            <button
              mat-flat-button
              color="primary"
              class="full-width-btn"
              (click)="checkoutClicked.emit()"
            >
              Checkout
            </button>
          </mat-card-actions>
        </mat-card>
      </div>
    </div>
  } @else {
    <div class="empty-cart-message">
      <p>Your shopping cart is empty.</p>
    </div>
  }
</div>
