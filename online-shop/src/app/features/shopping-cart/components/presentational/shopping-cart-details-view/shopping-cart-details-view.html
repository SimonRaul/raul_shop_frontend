<div class="shopping-cart">
  @if (items().length > 0) {
    <div class="page-title">
      <h1 i18n="@@cart.title">Your Cart</h1>
    </div>

    <div class="cart-container">
      <div class="cart-items-list">
        @for (item of items(); track item.product.id) {
          <mat-card class="cart-item-card">
            <mat-card-content class="cart-item-content">
              <div class="item-image">
                <img [src]="item.product.imageUrl" [alt]="item.product.name" />
              </div>

              <div class="item-details">
                <span class="item-name">{{ item.product.name }}</span>
                <span class="item-price" i18n="@@cart.item.price">
                  Price: {{ item.product.price }} RON
                </span>
              </div>

              <div class="item-actions">
                <div class="quantity-control">
                  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="qty-field">
                    <mat-label i18n="@@cart.item.quantity">Quantity:</mat-label>
                    <input
                      matInput
                      id="qty-{{ item.product.id }}"
                      #qtyInput
                      type="number"
                      class="qty-input"
                      [value]="item.quantity"
                      min="1"
                      (change)="
                        quantityChanged.emit({
                          productId: item.product.id,
                          rawValue: qtyInput.value,
                        })
                      "
                    />
                  </mat-form-field>
                </div>
                <button
                  mat-stroked-button
                  color="warn"
                  (click)="itemRemoved.emit(item.product.id)"
                  i18n="@@cart.item.delete"
                >
                  Delete
                </button>
              </div>
            </mat-card-content>
          </mat-card>
        }
      </div>

      <div class="summary-wrapper">
        <mat-card class="order-summary-card">
          <mat-card-header>
            <mat-card-title i18n="@@cart.summary.title">Order Summary</mat-card-title>
          </mat-card-header>

          <mat-card-content>
            <div class="summary-row">
              <span i18n="@@cart.summary.totalItems">Total Items:</span>
              <span>{{ totalItems() }}</span>
            </div>
            <div class="summary-row total">
              <span i18n="@@cart.summary.totalPrice">Total Price:</span>
              <span i18n="@@cart.summary.priceValue">{{ totalPrice() }} RON</span>
            </div>
          </mat-card-content>

          <mat-card-actions>
            <button
              mat-flat-button
              color="primary"
              class="full-width-btn"
              (click)="checkoutClicked.emit()"
              i18n="@@cart.checkout"
            >
              Checkout
            </button>
          </mat-card-actions>
        </mat-card>
      </div>
    </div>
  } @else {
    <div class="empty-cart-message">
      <p i18n="@@cart.empty">Your shopping cart is empty.</p>
    </div>
  }
</div>
